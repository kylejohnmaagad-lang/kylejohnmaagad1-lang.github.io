<!-- CONTACT SECTION -->
<section class="contact-section">

  <h1 class="contact-title">Contact me</h1>

  <p class="contact-subtitle">
    Cultivating connection: Reach out and Connect with me
  </p>

  <!-- CONTACT FORM -->
  <form 
    action="https://formsubmit.co/kylejohnmaagad@gmail.com"
    method="POST"
    class="contact-container"
  >

    <!-- LEFT SIDE -->
    <div class="contact-left">

      <input 
        type="text"
        name="name"
        placeholder="Name"
        required
      >

      <textarea 
        name="message"
        placeholder="Project Details..."
        required
      ></textarea>

    </div>

    <!-- RIGHT SIDE -->
    <div class="contact-right">

      <input 
        type="email"
        name="email"
        placeholder="Email"
        required
      >

      <input 
        type="text"
        name="phone"
        placeholder="Phone Number"
      >

      <input 
      type="hidden" 
      name="_next" 
      value="https://kylejohnmaagad-lang.github.io/index.html"
      >

      <input type="hidden" name="_captcha" value="false">

      <input 
        type="submit"
        value="Send"
        class="send-btn"
      >

    </div>

  </form>

  <!-- CONTACT INFO -->
  <div class="contact-info">

    <div class="info-item">
      <img src="phone-call.png" alt="phone">
      <p>09061078589</p>
    </div>

    <div class="info-item">
      <img src="email.png" alt="email">
      <p>kylejohnmaagad@gmail.com</p>
    </div>

    <div class="info-item">
      <img src="Location Icon .png" alt="location">
      <p>Zone 6, Matangad, Gitagum, Mis. Or.</p>
    </div>

  </div>

</section>
